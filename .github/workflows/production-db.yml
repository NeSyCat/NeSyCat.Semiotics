# Why this workflow exists: see .github/workflows/preview-db.yml — same
# reasoning (Supabase auto-applies only its own supabase/migrations/*.sql
# format; Prisma 8's contract model owns migrations here). This is the
# production counterpart: it runs on push to main, once prisma/ changes
# have merged, against the real Supabase project (not a branch).
#
# Production is ALREADY SIGNED (adopted once, out-of-band, via
# `contract infer` + `contract emit` + `db sign`, executing zero
# migrations). So there is deliberately NO `db init` path here — if
# `db verify` fails, that means the live prod schema has drifted from what
# this workflow believes is signed, and the job must fail loudly rather
# than silently trying to bootstrap/overwrite a production database.
#
# DB URL passing choice: PROD_DIRECT_URL is exported under two names —
# PRISMA_DB_URL (which prisma.config.ts reads, with a DIRECT_URL fallback,
# for every `npx prisma db ...` call) and PROD_DIRECT_URL (used verbatim by
# the raw `psql` steps for the out-of-contract SQL lane).

name: Production DB Migration

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      PRISMA_DB_URL: ${{ secrets.PROD_DIRECT_URL }}
      PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Offline; required before any db verify/init/update call (rc.5:
      # missing this makes `db verify` exit 2, "no emitted contract").
      - name: Emit contract artifacts
        run: npx prisma contract emit

      # Out-of-contract SQL lane, part 1: SECURITY DEFINER helper
      # functions. No-op against prod when already applied (CREATE OR
      # REPLACE is idempotent).
      - name: Apply out-of-contract SQL — functions
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/01-functions.sql

      # One-time structural changes the contract planner can't derive (e.g.
      # primary-key swaps). Existence-guarded + idempotent; runs BEFORE the
      # gate/update so `db update` always sees the post-structural shape.
      - name: Apply out-of-contract SQL — structural preflight
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/00-preflight.sql

      # Adoption gate. `db verify` fails with CONTRACT.MARKER_MISMATCH for
      # EVERY legitimate contract edit (the signed marker still holds the
      # previous contract's hash) — that is the normal evolution signal, not
      # an error, and must proceed to `db update` (which applies the delta
      # and re-signs). What must NEVER proceed: CONTRACT.MARKER_MISSING —
      # a database that was never adopted (or the wrong database entirely).
      # Production must never be auto-bootstrapped. Learned in the sandbox
      # on the first real contract edit; a blanket hard verify here would
      # have blocked every schema change forever.
      - name: Adoption gate (verify marker; allow contract advance)
        run: |
          set +e
          out=$(npx prisma db verify 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "Marker and schema match the contract — update will be a no-op."
          elif echo "$out" | grep -q "CONTRACT.MARKER_MISMATCH"; then
            echo "Marker holds a previous contract hash — legitimate contract evolution; proceeding to db update."
          elif echo "$out" | grep -q "CONTRACT.MARKER_MISSING"; then
            echo "::error::Production database is NOT adopted (no contract marker). Refusing to touch it — run the Adopt Production workflow first."
            exit 1
          else
            echo "::error::db verify failed for an unexpected reason — investigate before any update runs."
            exit 1
          fi

      - name: Update production database to match the contract
        run: npx prisma db update -y --advance-ref db

      # Post-update hard verify: after the update re-signs, marker AND live
      # schema must both match the contract exactly — no exceptions here.
      - name: Verify signed state
        run: npx prisma db verify

      # Out-of-contract SQL lane, part 2: orphan-organization guard
      # trigger. No-op against prod when already applied (DROP TRIGGER IF
      # EXISTS + CREATE).
      - name: Apply out-of-contract SQL — guards
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/02-guards.sql
      # Out-of-contract SQL lane, part 3: Supabase Realtime publication
      # membership for public.diagrams (live sidebar/content sync).
      # Idempotent; inert against a DB without the supabase_realtime
      # publication.
      - name: Apply out-of-contract SQL — realtime publication
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/03-realtime.sql

